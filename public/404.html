<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=/">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: #0a2540; background: #f6f8fb; }
    .box { text-align: center; padding: 24px; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .spin { width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #1e90ff; border-radius: 50%; animation: s 0.9s linear infinite; margin: 0 auto 12px; }
    @keyframes s { to { transform: rotate(360deg); } }
    .hint { font-size: 14px; color: #334155; }
    a { color: #1e90ff; text-decoration: none; }
  </style>
  <script>
    (function () {
      var target = '/';
      if (!/\/$/.test(target)) target += '/';
      try {
        target += location.search || '';
        target += location.hash || '';
        location.replace(target);
      } catch (_) {
        location.href = target;
      }
    })();
  </script>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <div class="hint">Redirecting to the application… If not redirected, <a href="/">go to home</a>.</div>
  </div>
</body>
</html>
